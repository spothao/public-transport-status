name: Update rail status

on:
  schedule:
    # Mon-Fri around 8:30am MYT (00:30 UTC) — two staggered runs because GitHub
    # cron delays/drops single runs in this US-peak window; :17/:43 avoid the
    # oversubscribed :00/:30 minute marks.
    - cron: "17 0 * * 1-5"
    - cron: "43 0 * * 1-5"
    # Mon-Fri around 4:30pm MYT (08:30 UTC), same staggering.
    - cron: "17 8 * * 1-5"
    - cron: "43 8 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch status
        run: python scripts/fetch_status.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Update status.json [skip ci]"
          git push
